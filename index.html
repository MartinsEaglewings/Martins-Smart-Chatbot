<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Martins Super Tech | AI Elite</title>
    <style>
        /* Luxury Golden & Black Theme */
        :root {
            --gold: #FFD700;
            --dark-gold: #B8860B;
            --black: #000000;
            --gray: #111111;
            --glass: rgba(255, 215, 0, 0.1);
        }

        body {
            background-color: var(--black);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            justify-content: space-between;
        }

        header {
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid var(--gold);
            background: linear-gradient(to bottom, #1a1a1a, #000);
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
        }

        h1 {
            color: var(--gold);
            margin: 0;
            font-size: 1.4rem;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        #chatBox {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-image: radial-gradient(circle at center, #111 0%, #000 100%);
        }

        .msg {
            max-width: 85%;
            padding: 12px 18px;
            border-radius: 15px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .user-msg {
            align-self: flex-end;
            background: linear-gradient(45deg, var(--dark-gold), var(--gold));
            color: #000;
            font-weight: bold;
            border-bottom-right-radius: 2px;
        }

        .ai-msg {
            align-self: flex-start;
            background: var(--gray);
            border: 1px solid var(--gold);
            color: #fff;
            border-bottom-left-radius: 2px;
        }

        .input-container {
            padding: 15px;
            background: #0a0a0a;
            display: flex;
            gap: 10px;
            border-top: 1px solid var(--dark-gold);
        }

        input {
            flex: 1;
            background: #1a1a1a;
            border: 1px solid var(--dark-gold);
            color: var(--gold);
            padding: 12px;
            border-radius: 25px;
            outline: none;
        }

        button {
            background: var(--gold);
            border: none;
            color: #000;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #fff;
            box-shadow: 0 0 10px var(--gold);
        }

        /* Custom Scrollbar for Luxury Feel */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }
    </style>
</head>
<body>

<header>
    <h1>Martins Super Tech AI</h1>
</header>

<div id="chatBox">
    <div class="msg ai-msg">System Online. How can I assist you today, Martins?</div>
</div>

<div class="input-container">
    <input type="text" id="userInput" placeholder="Ask Martins AI..." onkeypress="if(event.key==='Enter') sendChat()">
    <button onclick="sendChat()">SEND</button>
</div>

<script>
    // Your Private API Key Integrated
    const API_KEY = "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";

    async function sendChat() {
        const input = document.getElementById('userInput');
        const chatBox = document.getElementById('chatBox');
        const text = input.value.trim();

        if (!text) return;

        // Display User Message
        const userDiv = document.createElement('div');
        userDiv.className = 'msg user-msg';
        userDiv.innerText = text;
        chatBox.appendChild(userDiv);
        
        input.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${API_KEY}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [{ role: "user", content: text }],
                    temperature: 0.6
                })
            });

            const data = await response.json();
            const reply = data.choices[0].message.content;

            // Display AI Message
            const aiDiv = document.createElement('div');
            aiDiv.className = 'msg ai-msg';
            aiDiv.innerText = reply;
            chatBox.appendChild(aiDiv);

        } catch (error) {
            const errDiv = document.createElement('div');
            errDiv.className = 'msg ai-msg';
            errDiv.style.borderColor = "red";
            errDiv.innerText = "Connection Error. Please check your internet.";
            chatBox.appendChild(errDiv);
        }

        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

</body>
</html>
